    } else if(kind==="bar"){
      const T=agTable(sub,xk,null,yk);
      data.push({type:"bar",x:T.xs.map(nm),y:T.xs.map(x=>T.g(x,null)),xaxis:ax,yaxis:ay,
        showlegend:false,marker:{color:pal(i)}});
    } else if(kind==="line"){
      const srt=[...sub].sort((a,b)=>String(a[xk]).localeCompare(String(b[xk]),undefined,{numeric:true}));
      data.push({type:"scatter",mode:"lines+markers",x:srt.map(r0=>r0[xk]),y:srt.map(r0=>r0[yk]),
        xaxis:ax,yaxis:ay,showlegend:false,line:{color:pal(i),width:o.lineWidth},
        marker:{size:o.markerSize*.8,color:pal(i)}});
    } else {
      data.push({type:"scatter",mode:"markers",x:sub.map(r0=>r0[xk]),y:sub.map(r0=>r0[yk]),
        xaxis:ax,yaxis:ay,showlegend:false,
        marker:{color:ck?pal(i):pal(0),size:o.markerSize*.85,opacity:.75,line:{width:.4,color:"#fff"}}});
    }
    anns.push({xref:"paper",yref:"paper",x:x0,y:y0+hgt,xanchor:"left",yanchor:"bottom",
      text:`<b>${escapeHTML(nm(g))}</b>  <span style="opacity:.6">n=${sub.length}</span>`,
      showarrow:false,font:{size:pt2px(S.style.fsTick)}});
  });
  layout.annotations=anns;
  return {data,layout,multiAxis:true,autoTitles:{x:xk,y:yk||"Count"},facet:true};
};

/* ============================================================
   Q. THE CONTROLS — drag, palette, undo, peek, resize
   ============================================================ */
function $(id){return document.getElementById(id);}

/* ── undo / redo ─────────────────────────────────────── */
const HIST={past:[],future:[],busy:false};
const snapshot=()=>JSON.stringify({chart:S.chart,roles:S.roles,opts:S.opts,style:S.style,
  lab:S.lab,notes:S.notes,sig:S.sig,order:S.order,filters:S.filters,off:[...S.off]});
let lastSnap=null, snapT=null;
function mark(){
  if(HIST.busy) return;
  clearTimeout(snapT);
  snapT=setTimeout(()=>{
    const s=snapshot();
    if(s===lastSnap) return;
    if(lastSnap) HIST.past.push(lastSnap);
    if(HIST.past.length>60) HIST.past.shift();
    HIST.future.length=0; lastSnap=s;
  },380);
}
function restore(s){
  const j=JSON.parse(s);
  HIST.busy=true;
  S.chart=j.chart; S.roles=j.roles; S.opts=j.opts; S.style=j.style; S.lab=j.lab;
  S.notes=j.notes; S.sig=j.sig; S.order=j.order; S.filters=j.filters; S.off=new Set(j.off);
  lastSnap=s; buildUI(); render(); HIST.busy=false;
}
function undo(){
  if(!HIST.past.length) return toast("Nothing left to undo.");
  HIST.future.push(lastSnap); restore(HIST.past.pop()); toast("Undone.");
}
function redo(){
  if(!HIST.future.length) return toast("Nothing to redo.");
  HIST.past.push(lastSnap); restore(HIST.future.pop()); toast("Redone.");
}

/* ── drag a column onto a role slot ──────────────────── */
let DRAG=null;
function kindAccepts(kind,type){
  if(kind==="any") return true;
  if(kind==="num") return type==="num";
  if(kind==="cat") return type==="cat"||type==="time";
  if(kind==="time") return type==="time";
  return true;
}
function armSlots(on){
  document.querySelectorAll(".slot").forEach(s=>{
    s.classList.remove("hot");
    s.classList.toggle("armed",!!(on&&kindAccepts(s.dataset.kind,DRAG?.type)));
  });
}
function wireDrag(){
  document.addEventListener("dragstart",e=>{
    const row=e.target.closest("[data-drag]"); if(!row) return;
    DRAG={name:row.dataset.drag,type:row.dataset.dtype};
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed="copy";
    try{e.dataTransfer.setData("text/plain",DRAG.name);}catch(_){}
    armSlots(true);
    const r=$("railRight"); if(r) r.dataset.hide="false";
  });
  document.addEventListener("dragend",()=>{
    document.querySelectorAll(".dragging").forEach(n=>n.classList.remove("dragging"));
    armSlots(false); DRAG=null;
  });
  document.addEventListener("dragover",e=>{
    const slot=e.target.closest?.(".slot"); if(!slot||!DRAG) return;
    if(!kindAccepts(slot.dataset.kind,DRAG.type)) return;
    e.preventDefault(); e.dataTransfer.dropEffect="copy";
    document.querySelectorAll(".slot.hot").forEach(s=>s.classList.remove("hot"));
    slot.classList.add("hot");
  });
  document.addEventListener("drop",e=>{
    const slot=e.target.closest?.(".slot"); if(!slot||!DRAG) return;
    if(!kindAccepts(slot.dataset.kind,DRAG.type)) return;
    e.preventDefault(); e.stopPropagation();
    const k=slot.dataset.slot, name=DRAG.name;
    if(slot.dataset.multi){
      const cur=[].concat(S.roles[k]||[]);
      if(!cur.includes(name)) cur.push(name);
      S.roles[k]=cur;
    } else S.roles[k]=name;
    armSlots(false); DRAG=null;
    mark(); buildUI(); render();
    toast(`${name} → ${CH(S.chart).roles.find(r0=>r0.k===k)?.label||k}`);
  },true);
}

/* ── live preview on hover ───────────────────────────── */
let peekT=null, peekId=null;
function previewFig(id,w,h){
  const snapC=S.chart, snapR=S.roles, snapS=S.style, snapL=S.lab, snapN=S.notes, snapG=S.sig;
  try{
    S.chart=id; S.roles={};
    S.style={...snapS,wmm:w/mm2px(1),hmm:h/mm2px(1),fs:6,fsTick:5.5,fsTitle:6,margin:.72,showLegend:false};
    S.lab={...snapL,title:"",cap:"",xt:"",yt:""};
    S.notes=[]; S.sig=[];
    autoRoles();
    CH(id).roles.forEach(r0=>{
      const v=snapR[r0.k]; if(!v) return;
      const ok=r0.multi?[].concat(v).every(n2=>findCol(n2)):(findCol(v)&&colsFor(r0.kind).some(c=>c.name===v));
      if(ok) S.roles[r0.k]=v;
    });
    if(CH(id).roles.some(r0=>r0.req&&!S.roles[r0.k])) return null;
    return finish(B[id]({rows:activeRows(),R:k=>S.roles[k]}));
  }catch(err){ return null; }
  finally{ S.chart=snapC; S.roles=snapR; S.style=snapS; S.lab=snapL; S.notes=snapN; S.sig=snapG; }
}
function showPeek(id,anchor){
  if(!S.ready||window.innerWidth<1180) return;
  const spec=CH(id); if(!spec) return;
  peekId=id;
  const box=$("peek"), W=296, H=186;
  $("peekName").textContent=spec.name;
  const sc=ranked().find(x=>x.c.id===id);
  $("peekFit").textContent=sc?`fit ${sc.s}`:"";
  $("peekWhy").textContent=spec.when;
  const r=anchor.getBoundingClientRect();
  let top=Math.min(window.innerHeight-300, Math.max(70, r.top-40));
  let left=r.right+12;
  if(left+W>window.innerWidth-12) left=r.left-W-12;
  box.style.top=top+"px"; box.style.left=left+"px";
  box.hidden=false;
  const fig=previewFig(id,W,H);
  const gd=$("peekPlot");
  if(!fig){ gd.innerHTML=`<div style="height:100%;display:flex;align-items:center;justify-content:center;
    color:#8a8a90;font-size:11px;padding:14px;text-align:center">Needs columns this sheet doesn't have.</div>`; return; }
  try{ Plotly.react(gd,fig.data,fig.layout,{displayModeBar:false,responsive:false,staticPlot:true}); }
  catch(e){ gd.innerHTML=""; }
}
function hidePeek(){
  const p=$("peek"); if(p&&!p.hidden) p.hidden=true;
  if(peekId!==null){peekId=null;} clearTimeout(peekT);
}
function wirePeek(){
  document.addEventListener("mouseover",e=>{
    const t=e.target.closest?.("[data-peek]");
    if(!t){ if(!e.target.closest?.("#peek")) hidePeek(); return; }
    if(t.dataset.peek===peekId) return;
    clearTimeout(peekT);
    peekT=setTimeout(()=>showPeek(t.dataset.peek,t),160);
  });
  document.addEventListener("mouseleave",hidePeek);
  ["scroll","wheel"].forEach(ev=>document.addEventListener(ev,hidePeek,true));
}

/* ── command palette ─────────────────────────────────── */
let cmdSel=0, cmdHits=[];
function openCmd(){
  $("cmd").hidden=false; $("cmdin").value=""; cmdSel=0; drawCmd(); $("cmdin").focus();
}
function closeCmd(){ $("cmd").hidden=true; }
function drawCmd(){
  const q=$("cmdin").value.trim().toLowerCase();
  const rank=S.ready?ranked():CHARTS.map(c=>({c,s:0}));
  const byId={}; rank.forEach(x=>byId[x.c.id]=x.s);
  cmdHits=CHARTS.filter(c=>!q||(c.name+" "+c.blurb+" "+(c.src||"")+" "+c.when).toLowerCase().includes(q))
    .sort((a,b)=>{
      const an=a.name.toLowerCase().startsWith(q)?1:0, bn=b.name.toLowerCase().startsWith(q)?1:0;
      if(an!==bn) return bn-an;
      return (byId[b.id]||0)-(byId[a.id]||0);
    }).slice(0,40);
  cmdSel=Math.min(cmdSel,Math.max(0,cmdHits.length-1));
  $("cmdlist").innerHTML=cmdHits.map((c,i)=>`
    <div class="cmdrow" data-cmd="${c.id}" aria-selected="${i===cmdSel}">
      ${icon(c.id)}<span>${escapeHTML(c.name)}</span>
      <small>${c.tier==="cs"?escapeHTML(c.src||""):c.tier==="rare"?"underused":FAMS[c.fam]||""}</small>
    </div>`).join("")||`<div class="cmdrow" style="opacity:.5">No plot by that name.</div>`;
  const sel=$("cmdlist").querySelector('[aria-selected=true]');
  if(sel) sel.scrollIntoView({block:"nearest"});
}
function wireCmd(){
  $("cmdin").addEventListener("input",()=>{cmdSel=0;drawCmd();});
  $("cmdin").addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();cmdSel=Math.min(cmdSel+1,cmdHits.length-1);drawCmd();}
    else if(e.key==="ArrowUp"){e.preventDefault();cmdSel=Math.max(cmdSel-1,0);drawCmd();}
    else if(e.key==="Enter"){e.preventDefault();const c=cmdHits[cmdSel];if(c){closeCmd();pickChart(c.id);}}
    else if(e.key==="Escape"){closeCmd();}
  });
  $("cmd").addEventListener("click",e=>{
    if(e.target.id==="cmd") return closeCmd();
    const r=e.target.closest("[data-cmd]"); if(r){closeCmd();pickChart(r.dataset.cmd);}
  });
  $("cmdlist").addEventListener("mousemove",e=>{
    const r=e.target.closest("[data-cmd]"); if(!r) return;
    const i=cmdHits.findIndex(c=>c.id===r.dataset.cmd);
    if(i>=0&&i!==cmdSel){cmdSel=i;drawCmd();}
  });
}

/* ── plate resize handle ─────────────────────────────── */
function wireStage(){
  const grab=$("grab"); if(!grab) return;
  grab.addEventListener("pointerdown",e=>{
    e.preventDefault(); grab.setPointerCapture(e.pointerId);
    const plate=$("plate"), gd=$("plot");
    plate.classList.add("resizing");
    const x0=e.clientX, y0=e.clientY, w0=S.style.wmm, h0=S.style.hmm;
    const move=ev=>{
      const w=Math.max(30,Math.min(400,w0+(ev.clientX-x0)/mm2px(1)));
      const h=Math.max(25,Math.min(400,h0+(ev.clientY-y0)/mm2px(1)));
      S.style.wmm=Math.round(w*2)/2; S.style.hmm=Math.round(h*2)/2; S.style.page="custom";
      const {w:pw,h:ph}=figPx();
      $("platewrap").style.width=pw+"px"; plate.style.width=pw+"px"; plate.style.height=ph+"px";
      $("mmrule").innerHTML=ruleSVG(S.style.wmm,pw);
      try{ Plotly.relayout(gd,{width:pw,height:ph}); }catch(_){}
      updateFoot();
    };
    const up=ev=>{
      grab.removeEventListener("pointermove",move);
      grab.removeEventListener("pointerup",up);
      plate.classList.remove("resizing");
      mark(); buildUI(); render();
    };
    grab.addEventListener("pointermove",move);
    grab.addEventListener("pointerup",up);
  });
}

/* ── click on the figure to drop an annotation ───────── */
let ANNOT=false;
function setAnnot(on){
  ANNOT=on;
  const p=$("plate"); if(p) p.style.cursor=on?"crosshair":"";
  const b=$("btnAnnot"); if(b) b.setAttribute("aria-pressed",String(on));
  if(on) toast("Click anywhere on the figure to drop a note.");
}
function onPlotClick(e){
  if(!ANNOT) return;
  const gd=$("plot"), L=gd._fullLayout; if(!L) return;
  const r=gd.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const xf=(px-L.margin.l)/Math.max(1,L.width-L.margin.l-L.margin.r);
  const yf=1-(py-L.margin.t)/Math.max(1,L.height-L.margin.t-L.margin.b);
  S.notes.push({text:"New note",x:Math.round(xf*100),y:Math.round(yf*100),size:S.style.fs,box:false});
  setAnnot(false); mark(); buildUI(); render();
  const sec=document.querySelector('[data-sec="notes"]');
  if(sec){ sec.classList.remove("closed");
    const inp=sec.querySelector(`[data-note="${S.notes.length-1}"][data-k="text"]`);
    if(inp){ inp.focus(); inp.select(); } }
}

/* ── surprise me ─────────────────────────────────────── */
function surprise(){
  if(!S.ready) return toast("Load a sheet first — then the machine can surprise you.");
  const pool=ranked().filter(x=>x.c.tier!=="std"&&x.s>38&&x.c.id!==S.chart);
  if(!pool.length) return toast("Nothing unusual fits this sheet yet. Try including more columns.");
  const pick=pool[Math.floor(Math.random()*Math.min(pool.length,10))];
  pickChart(pick.c.id);
  toast(`${pick.c.name}${pick.c.src?" — borrowed from "+pick.c.src.toLowerCase():""}.`);
}

/* ── wire everything not already handled ─────────────── */
function wireExtras(){
  wireDrag(); wirePeek(); wireCmd();

  document.addEventListener("click",e=>{
    const p=e.target.closest("[data-pal]");
    if(p){ S.style.pal=p.dataset.pal; mark(); buildUI(); render(); return; }
    if(e.target.closest("#btnSurprise")) return surprise();
    if(e.target.closest("#btnAnnot")) return setAnnot(!ANNOT);
    if(e.target.closest("#btnUndo")) return undo();
  });

  const gs=$("gsearch");
  if(gs) gs.addEventListener("input",()=>{galQuery=gs.value;drawGallery();});

  document.addEventListener("keydown",e=>{
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"");
    const meta=e.metaKey||e.ctrlKey;
    if(meta&&e.key.toLowerCase()==="k"){e.preventDefault();$("cmd").hidden?openCmd():closeCmd();return;}
    if(meta&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
    if(meta&&e.key.toLowerCase()==="s"){e.preventDefault();exportImage("png");return;}
    if(e.key==="Escape"){closeCmd();hidePeek();if(ANNOT)setAnnot(false);return;}
    if(typing) return;
    if(e.key==="/"){e.preventDefault();openCmd();return;}
    if(e.key==="r"||e.key==="R"){surprise();return;}
    if(e.key==="a"||e.key==="A"){setAnnot(!ANNOT);return;}
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
      if(!S.ready) return;
      const R=ranked(); const i=R.findIndex(x=>x.c.id===S.chart);
      const n=(i+(e.key==="ArrowRight"?1:-1)+R.length)%R.length;
      if(R[n]) pickChart(R[n].c.id);
    }
  });

  ["input","change"].forEach(ev=>document.body.addEventListener(ev,()=>mark()));
  document.body.addEventListener("click",e=>{ if(e.target.closest("[data-chart],[data-pal],[data-ratio]")) mark(); });
  lastSnap=snapshot();
}

/* ── go ──────────────────────────────────────────────── */
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
