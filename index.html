<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE GRAPHINATOR — Dr. Mayank's figure press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* lab instrument case, lit by a safelight */
  --ink:#12292B; --ink-deep:#081A1C; --ink-mid:#1D3F42; --ink-line:#2C595E; --ink-well:#0C2225;
  --on:#DCEAE8; --on-dim:#87A9A7; --on-faint:#5B807F;
  --paper:#E8E7E1; --plate:#FFFFFF; --paper-line:#D2D1C8; --paper-ink:#14181A; --paper-dim:#68706F;
  --sig:#E9F50C; --sig-deep:#C2CC00; --sig-wash:rgba(233,245,12,.13);
  --warn:#FF9E2C;
  --cyan:#46D6E6; --cyan-wash:rgba(70,214,230,.16);
  --lilac:#B49BFF; --lilac-wash:rgba(180,155,255,.16);
  --ok:#5FD69B;
  --sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --disp:'Big Shoulders Display','Archivo Narrow',Impact,var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --rail:302px; --rail2:336px; --head:62px;
  --halftone:radial-gradient(circle at 1px 1px, rgba(233,245,12,.055) 1px, transparent 1.4px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ink-deep); color:var(--on); font-family:var(--sans);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ═══ masthead / nameplate ═══ */
.mast{
  height:var(--head);display:flex;align-items:center;gap:16px;padding:0 14px 0 18px;
  background:var(--ink);background-image:var(--halftone);background-size:5px 5px;
  border-bottom:1px solid var(--ink-line);position:relative;z-index:40;
}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--sig) 0 20%,var(--lilac) 20% 27%,var(--cyan) 27% 42%,transparent 42%);opacity:.95}
.nameplate{flex:none;line-height:1;user-select:none;position:relative}
.nameplate::before{
  content:"";position:absolute;left:-26px;right:-26px;top:-17px;bottom:-14px;pointer-events:none;
  background:radial-gradient(ellipse at 34% 58%,rgba(233,245,12,.26),rgba(205,225,0,.08) 50%,transparent 74%);
}
.nameplate .pre,.nameplate h1{position:relative}
.nameplate .pre{
  display:block;font-size:10.5px;font-weight:500;letter-spacing:.15em;color:#E4EF63;
  margin-bottom:2px;padding-left:2px;text-shadow:0 0 10px rgba(233,245,12,.75);
}
.nameplate h1{
  margin:0;font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:.05em;
  color:#FBFFD4;line-height:.86;
  text-shadow:
    0 0 2px rgba(252,255,222,.98),
    0 0 8px rgba(233,245,12,.95),
    0 0 20px rgba(233,245,12,.62),
    0 0 44px rgba(214,232,0,.44),
    0 0 84px rgba(198,220,0,.26);
}
.boot .nameplate h1{animation:wipe .6s .1s cubic-bezier(.7,0,.2,1) both, flicker 1s .68s steps(1,end) 1 both}
.boot .nameplate::before{animation:lampup .9s .5s ease-out both}
.boot .nameplate .pre{animation:fadein .4s .95s both}
@keyframes flicker{0%,6%{opacity:.22}8%{opacity:1}12%{opacity:.32}15%{opacity:.95}18%,100%{opacity:1}}
@keyframes lampup{from{opacity:0}to{opacity:1}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -2% 0 0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.mast .grow{flex:1}
.readout{
  font-family:var(--mono);font-size:10.5px;color:var(--on-dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:30vw;display:flex;gap:5px;align-items:center;
}
.readout b{color:var(--on);font-weight:500}
.lamp{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:none;
  box-shadow:0 0 0 3px var(--cyan-wash),0 0 7px var(--cyan)}
.lamp.off{background:var(--on-faint);box-shadow:none}

/* ═══ buttons ═══ */
.btn{
  border:1px solid var(--ink-line);background:var(--ink-mid);color:var(--on);border-radius:2px;
  padding:6px 11px;font-weight:500;font-size:12px;line-height:1.3;white-space:nowrap;
  transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:#28565A;border-color:#3B767C}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--sig);border-color:var(--sig);color:var(--ink-deep);font-weight:700}
.btn.pri:hover{background:#F4FB55;border-color:#F4FB55}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--on-dim)}
.btn.ghost:hover{background:var(--ink-mid);color:var(--on)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--ink-line);border-radius:2px;
  padding:1px 4px;color:var(--on-dim);margin-left:6px;background:var(--ink-well)}

/* ═══ shell ═══ */
.shell{height:calc(100% - var(--head));display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--rail2)}
.rail{
  background:var(--ink);background-image:var(--halftone);background-size:5px 5px;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--ink-line) transparent;
}
.rail.left{border-right:1px solid var(--ink-line)}
.rail.right{border-left:1px solid var(--ink-line)}
.rail::-webkit-scrollbar{width:10px}
.rail::-webkit-scrollbar-thumb{background:var(--ink-line);border:3px solid var(--ink);border-radius:5px}
.rail::-webkit-scrollbar-thumb:hover{background:#3B767C}
.boot .rail.left{animation:slideL .45s cubic-bezier(.2,.8,.3,1) both}
.boot .rail.right{animation:slideR .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes slideL{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}

.sec{border-bottom:1px solid var(--ink-line)}
.sec-h{
  display:flex;align-items:center;gap:8px;width:100%;padding:10px 13px;
  background:none;border:0;text-align:left;font-weight:600;font-size:11.5px;color:var(--on);
  letter-spacing:.01em;position:relative;
}
.sec-h::before{content:"";width:3px;height:11px;background:var(--sig);border-radius:1px;
  opacity:0;transition:opacity .15s;flex:none}
.sec:not(.closed) .sec-h::before{opacity:1}
.sec-h:hover{background:var(--ink-mid)}
.sec-h .chev{width:7px;height:7px;border-right:1.6px solid var(--on-faint);border-bottom:1.6px solid var(--on-faint);
  transform:rotate(45deg);margin-left:auto;transition:transform .18s;flex:none}
.sec.closed .chev{transform:rotate(-45deg)}
.sec.closed .sec-b{display:none}
.sec-b{padding:2px 13px 15px}

/* ═══ form atoms (on dark housing) ═══ */
.f{margin:10px 0 0}
.f>label{display:block;font-size:11px;color:var(--on-dim);margin-bottom:4px;font-weight:500}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
input[type=text],input[type=number],select,textarea{
  width:100%;border:1px solid var(--ink-line);background:var(--ink-well);color:var(--on);
  border-radius:2px;padding:6px 8px;font-size:12px;transition:border-color .12s,background .12s;
}
input[type=number]{font-family:var(--mono);font-size:11.5px}
textarea{resize:vertical;min-height:54px;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--on-faint)}
input:hover,select:hover,textarea:hover{border-color:#3B767C}
input:focus,select:focus,textarea:focus{border-color:var(--sig);background:#0A1D20;outline:none}
select{appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--on-dim) 50%),linear-gradient(135deg,var(--on-dim) 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 10px) 12px;background-size:4px 4px;
  background-repeat:no-repeat;padding-right:26px}
select option{background:var(--ink);color:var(--on)}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;cursor:pointer;color:var(--on)}
.chk input{margin:0;accent-color:var(--sig);width:13px;height:13px;flex:none}
.rng{display:flex;align-items:center;gap:9px}
.rng input[type=range]{flex:1;accent-color:var(--sig);height:3px}
.rng output{font-family:var(--mono);font-size:11px;color:var(--on-dim);min-width:34px;text-align:right}
.hint{font-size:11px;color:var(--on-faint);line-height:1.45;margin-top:6px}
.tag{font-family:var(--mono);font-size:10px;color:var(--on-faint)}

/* ═══ dropzone ═══ */
.drop{
  border:1.5px dashed var(--ink-line);border-radius:3px;background:var(--ink-well);
  padding:20px 14px;text-align:center;transition:border-color .14s,background .14s,transform .14s;
}
.drop.over{border-color:var(--sig);background:var(--sig-wash);transform:scale(1.015)}
.drop p{margin:0 0 10px;font-size:12px;color:var(--on-dim)}
.drop b{color:var(--on)}

/* ═══ column list — draggable chips ═══ */
.cols{margin:9px 0 0;border:1px solid var(--ink-line);border-radius:3px;background:var(--ink-well);overflow:hidden}
.crow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);
  transition:background .1s}
.crow:last-child{border-bottom:0}
.crow[draggable=true]{cursor:grab}
.crow[draggable=true]:hover{background:var(--ink-mid)}
.crow[draggable=true]:active{cursor:grabbing}
.crow.dragging{opacity:.35}
.crow.off{background:transparent}
.crow.off .cname{color:var(--on-faint);text-decoration:line-through}
.crow input[type=checkbox]{accent-color:var(--sig);margin:0;flex:none}
.grip{width:7px;height:12px;flex:none;opacity:.42;
  background:radial-gradient(circle,var(--on-dim) .9px,transparent 1px) 0 0/3.5px 4px}
.cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.ctype{border:1px solid var(--ink-line);border-radius:2px;background:var(--ink);font-size:10px;
  padding:1px 4px;font-family:var(--mono);color:var(--on-dim);appearance:none;cursor:pointer;background-image:none;padding-right:4px}
.cmeta{font-family:var(--mono);font-size:10px;color:var(--on-faint);flex:none}

/* ═══ role slots (drop targets) ═══ */
.slot{position:relative}
.slot select{padding-left:9px}
.slot.armed select{border-color:var(--cyan);background:var(--cyan-wash)}
.slot.hot select{border-color:var(--sig);background:var(--sig-wash);box-shadow:0 0 0 2px var(--sig-wash)}
.slot[data-multi].armed .cols{border-color:var(--cyan)}
.slot[data-multi].hot .cols{border-color:var(--sig);background:var(--sig-wash)}
.slot[data-multi].hot::after{top:9px;transform:none}
.slot.hot::after{content:"drop";position:absolute;right:9px;top:50%;transform:translateY(-3px);
  font-size:10px;font-family:var(--mono);color:var(--sig);pointer-events:none}

/* ═══ chart list ═══ */
.recs{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.tierlab{display:flex;align-items:center;gap:9px;margin:15px 0 6px;font-size:10.5px;font-weight:600;
  color:var(--on-dim);letter-spacing:.02em}
.tierlab:first-child{margin-top:4px}
.tierlab::after{content:"";flex:1;height:1px;background:var(--ink-line)}
.tierlab.rare{color:var(--cyan)}
.rec{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 8px;
  border:1px solid var(--ink-line);background:var(--ink-well);border-radius:2px;color:var(--on);
  transition:border-color .12s,background .12s,transform .08s;
}
.rec:hover{border-color:#3B767C;background:var(--ink-mid);transform:translateX(2px)}
.rec[aria-pressed=true]{border-color:var(--sig);background:var(--sig);color:var(--ink-deep)}
.rec[aria-pressed=true] .rname small{color:rgba(8,26,28,.62)}
.rec[aria-pressed=true] .fitbar{background:rgba(8,26,28,.22)}
.rec[aria-pressed=true] .fitbar i{background:var(--ink-deep)}
.rec .ic{width:25px;height:19px;flex:none;color:var(--on-dim)}
.rec:hover .ic{color:var(--on)}
.rec.rare .ic{color:var(--cyan)}
.rec[aria-pressed=true] .ic{color:var(--ink-deep)}
.rname{flex:1;min-width:0;font-size:12px;font-weight:500;letter-spacing:-.005em}
.rname small{display:block;font-weight:400;font-size:10.5px;color:var(--on-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitbar{width:26px;height:3px;border-radius:2px;background:var(--ink-line);flex:none;overflow:hidden}
.fitbar i{display:block;height:100%;background:var(--on-dim);transition:width .3s}
.rec.rare .fitbar i{background:var(--cyan)}
.rec.cs .ic{color:var(--lilac)}
.rec.cs .fitbar i{background:var(--lilac)}
.tierlab.cs{color:var(--lilac)}
.gcard.cs .ic,.gcard.cs:hover .ic{color:var(--lilac)}
.gcard.cs:hover{border-color:var(--lilac)}

/* ═══ stage + plate ═══ */
.stage{
  overflow:auto;text-align:center;padding:30px 28px 46px;
  background:
    repeating-linear-gradient(0deg,transparent 0 27px,rgba(0,0,0,.032) 27px 28px),
    var(--paper);
  color:var(--paper-ink);position:relative;
}
.platewrap{position:relative;display:inline-block;text-align:left}
.boot .platewrap{animation:drop .5s .18s cubic-bezier(.2,.9,.3,1) both}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.mmrule{height:14px;position:relative;margin-bottom:6px;color:var(--paper-dim)}
.mmrule svg{display:block;width:100%;height:14px;overflow:visible}
.plate{
  background:var(--plate);position:relative;
  box-shadow:7px 7px 0 rgba(233,245,12,.30), 0 0 0 1px var(--paper-line);
  transition:box-shadow .18s;
}
.plate.resizing{box-shadow:7px 7px 0 rgba(233,245,12,.52), 0 0 0 1.5px var(--sig)}
.crop{position:absolute;width:12px;height:12px;pointer-events:none}
.crop::before,.crop::after{content:"";position:absolute;background:var(--paper-dim);opacity:.5}
.crop::before{width:12px;height:1px} .crop::after{width:1px;height:12px}
.crop.tl{top:-7px;left:-7px} .crop.tr{top:-7px;right:-7px}
.crop.bl{bottom:-7px;left:-7px} .crop.br{bottom:-7px;right:-7px}
.crop.tr::before,.crop.tr::after{right:0} .crop.bl::before,.crop.bl::after{bottom:0}
.crop.br::before,.crop.br::after{right:0;bottom:0}
#plot{width:100%;height:100%}
.grab{
  position:absolute;right:-5px;bottom:-5px;width:16px;height:16px;cursor:nwse-resize;z-index:5;
  background:linear-gradient(135deg,transparent 46%,var(--sig) 46% 60%,transparent 60%,transparent 68%,var(--sig) 68% 82%,transparent 82%);
}
.platefoot{max-width:100%;margin:16px auto 0;padding:0 2px}
.cap{font-size:12px;line-height:1.55;color:var(--paper-ink);max-width:72ch}
.cap b{font-weight:700}
.cap.empty{color:var(--paper-dim);font-style:italic}
.dims{font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);margin-top:9px;display:flex;gap:15px;flex-wrap:wrap}
.dims span{position:relative;padding-left:9px}
.dims span::before{content:"";position:absolute;left:0;top:5px;width:3px;height:3px;background:var(--sig);border-radius:50%}

.blank{max-width:470px;margin:8vh auto 0;text-align:center;display:inline-block}
.blank h2{font-family:var(--disp);font-size:38px;font-weight:800;letter-spacing:.02em;margin:0 0 10px;line-height:.94;color:var(--paper-ink)}
.blank p{color:var(--paper-dim);margin:0 0 20px;font-size:13px;line-height:1.6}
.blank .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.blank .btn{background:var(--ink);border-color:var(--ink);color:var(--on)}
.blank .btn:hover{background:var(--ink-mid);border-color:var(--ink-mid)}
.blank .btn.pri{background:var(--sig);border-color:var(--sig)}

/* ═══ checklist ═══ */
.check{list-style:none;margin:9px 0 0;padding:0;font-size:11.5px}
.check li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07);align-items:flex-start}
.check li:last-child{border-bottom:0}
.check b{flex:none;width:14px;font-weight:700;font-family:var(--mono);font-size:11px;line-height:1.55}
.check .ok b{color:var(--ok)} .check .no b{color:var(--warn)}
.check .ok{color:var(--on-dim)} .check .no{color:var(--on)}

/* ═══ gallery ═══ */
.veil{position:fixed;inset:0;background:rgba(4,16,18,.74);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px;animation:fadein .18s both}
.veil[hidden]{display:none}
.modal{background:var(--ink);background-image:var(--halftone);background-size:5px 5px;
  border:1px solid var(--ink-line);border-radius:4px;width:min(1140px,100%);max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 26px 70px -20px rgba(0,0,0,.7);
  animation:pop .22s cubic-bezier(.2,.9,.3,1) both}
@keyframes pop{from{transform:scale(.985) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:14px;padding:14px 17px;border-bottom:1px solid var(--ink-line)}
.modal-h h2{margin:0;font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.03em;line-height:1}
.modal-h p{margin:2px 0 0;font-size:11.5px;color:var(--on-faint)}
.modal-b{overflow-y:auto;padding:17px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px}
.gcard{border:1px solid var(--ink-line);background:var(--ink-well);border-radius:3px;padding:12px;
  text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--on);
  transition:border-color .14s,transform .14s,background .14s}
.gcard:hover{border-color:var(--sig);transform:translateY(-2px);background:var(--ink-mid)}
.gcard .ic{width:100%;height:54px;color:var(--on-dim)}
.gcard:hover .ic{color:var(--sig)}
.gcard.rare .ic{color:var(--cyan)}
.gcard.rare:hover .ic{color:var(--cyan)}
.gcard h3{margin:0;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.gcard p{margin:0;font-size:11px;color:var(--on-dim);line-height:1.5}
.gcard .why{color:var(--on-faint)}
.pill{font-size:9px;font-weight:700;padding:2px 6px;border-radius:9px;background:var(--ink-line);
  color:var(--on-dim);flex:none;letter-spacing:.03em}
.gcard.rare .pill{background:var(--cyan-wash);color:var(--cyan)}
.gcard.cs .pill{background:var(--lilac-wash);color:var(--lilac)}
.gfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.gfilter button{border:1px solid var(--ink-line);background:var(--ink-well);color:var(--on-dim);
  border-radius:13px;padding:4px 12px;font-size:11.5px;transition:all .12s}
.gfilter button:hover{color:var(--on);border-color:#3B767C}
.gfilter button[aria-pressed=true]{background:var(--sig);border-color:var(--sig);color:var(--ink-deep);font-weight:700}
#gsearch{width:190px;margin-left:auto;border-radius:13px;padding:4px 12px}

/* ═══ command palette ═══ */
.cmd{position:fixed;inset:0;z-index:70;background:rgba(4,16,18,.62);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 20px;animation:fadein .14s both}
.cmd[hidden]{display:none}
.cmdbox{width:min(560px,100%);background:var(--ink);border:1px solid var(--ink-line);border-radius:4px;
  overflow:hidden;box-shadow:0 24px 60px -16px rgba(0,0,0,.75);animation:pop .18s both}
#cmdin{border:0;border-bottom:1px solid var(--ink-line);border-radius:0;background:var(--ink-well);
  padding:14px 16px;font-size:15px}
#cmdin:focus{border-color:var(--ink-line);border-bottom-color:var(--sig)}
.cmdlist{max-height:46vh;overflow-y:auto;padding:6px}
.cmdrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:2px;cursor:pointer;font-size:12.5px}
.cmdrow .ic{width:24px;height:18px;flex:none;color:var(--on-faint)}

function inferType(values){
  const nonNull = values.filter(v=>v!==null&&v!==undefined&&v!=="");
  if(!nonNull.length) return "cat";
  let n=0,d=0;
  for(const v of nonNull){
    if(typeof v==="number"&&isFinite(v)) n++;
    else if(v instanceof Date) d++;
    else if(typeof v==="string"){
      const t=v.trim().replace(/[, ]/g,"");
      if(t!==""&&!isNaN(Number(t))) n++;

  if(n/N>.85){
    const uniq=new Set(nonNull.map(String)).size;

  if(v===null||v===undefined||v==="") return null;
  if(t==="num"){ const x=typeof v==="number"?v:Number(String(v).replace(/[, ]/g,"")); return isFinite(x)?x:null; }
  if(t==="time"){ const d=v instanceof Date?v:new Date(v); return isNaN(d)?String(v):d.toISOString().slice(0,10); }
  return String(v);
}
function buildColumns(raw){
  if(!raw.length) return [];
  const keys=Object.keys(raw[0]);
  return keys.map(k=>{
    const vals=raw.map(r=>r[k]);
    const t=inferType(vals);
    const clean=vals.map(v=>coerce(v,t));
    const present=clean.filter(v=>v!==null);
    const uniq=[...new Set(present.map(String))];
    const c={name:k,type:t,missing:clean.length-present.length,card:uniq.length,levels:uniq.slice(0,300)};
    if(t==="num"){const a=num(present); c.min=Math.min(...a);c.max=Math.max(...a);c.mean=mean(a);c.sd=sd(a);}
    return c;
  });
}
function applyTypes(raw){
  S.rows = raw.map(r=>{
    const o={}; S.columns.forEach(c=>{o[c.name]=coerce(r[c.name],c.type);}); return o;
  });
}
function loadSheet(name){
  S.sheet=name;
  const raw=S.sheets[name];
  S.columns=buildColumns(raw);
  applyTypes(raw);
  S.off=new Set();
  S.ready=S.rows.length>0;
}
function readWorkbook(data,fname){
  const wb=XLSX.read(data,{type:"array",cellDates:true});
  S.sheets={}; 
  wb.SheetNames.forEach(n=>{
    const j=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:null,raw:true});
    if(j.length) S.sheets[n]=j;
  });
  if(!Object.keys(S.sheets).length) throw new Error("Every sheet in this file is empty. Check that row 1 holds the column names.");
  S.fileName=fname;
  loadSheet(Object.keys(S.sheets)[0]);
}

/* active (filtered, included) view */
function activeRows(){
  let rows=S.rows;
  for(const f of S.filters){
    if(!f.col||!f.op) continue;
    rows=rows.filter(r=>{
      const v=r[f.col];
      if(f.op==="in") return f.vals?.includes(String(v));
      if(f.op==="notnull") return v!==null&&v!=="";
      const x=Number(v), y=Number(f.val);
      if(f.op===">") return x>y; if(f.op==="<") return x<y;
      if(f.op===">=") return x>=y; if(f.op==="<=") return x<=y;
      if(f.op==="==") return String(v)===String(f.val);
      if(f.op==="!=") return String(v)!==String(f.val);
      return true;
    });
  }
  return rows;
}
const activeCols = () => S.columns.filter(c=>!S.off.has(c.name));
const colsOf = t => activeCols().filter(c=>c.type===t);
const findCol = n => S.columns.find(c=>c.name===n);

function profile(){
  const nums=colsOf("num"), cats=colsOf("cat"), times=colsOf("time");
  const rows=activeRows();
  return {
    nums,cats,times,n:rows.length,
    nNum:nums.length,nCat:cats.length,nTime:times.length,
    lowCat:cats.filter(c=>c.card<=12), midCat:cats.filter(c=>c.card>1&&c.card<=30),
    binCat:cats.filter(c=>c.card===2),
    hasRepeat: cats.some(c=>c.card>1 && rows.length/c.card>=3),
    maxCard: cats.length? Math.max(...cats.map(c=>c.card)):0
  };
}

const PAL = ()=>PALETTES[S.style.pal].c;
const pal = i => PAL()[i % PAL().length];
const nm  = v => (S.lab.rename[v] ?? v);
const fmtN = v => (typeof v==="number" && isFinite(v)) ? (Math.abs(v)>=1000?v.toFixed(0):v.toFixed(S.opts.decimals)) : v;

function levelsOf(rows,key){
  const seen=[],s=new Set();
  rows.forEach(r=>{const v=r[key]==null?"(blank)":String(r[key]); if(!s.has(v)){s.add(v);seen.push(v);}});
  const c=findCol(key);
  if(c&&c.type==="num") seen.sort((a,b)=>Number(a)-Number(b));
  if(c&&c.type==="time") seen.sort();
  const want=S.order&&S.order[key];
  if(want&&want.length){
    const head=want.filter(v=>seen.includes(v));
    return [...head,...seen.filter(v=>!head.includes(v))];
  }
  return seen;
}
function sortLevels(levels,vals,mode){
  if(mode==="asc") return [...levels].sort((a,b)=>(vals[a]??0)-(vals[b]??0));
  if(mode==="desc") return [...levels].sort((a,b)=>(vals[b]??0)-(vals[a]??0));
  if(mode==="alpha") return [...levels].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
  return levels;
}
function agTable(rows,xk,sk,yk){
  const xs=levelsOf(rows,xk), ss=sk?levelsOf(rows,sk):[null];
  const val={},err={},cnt={};
  const bx=groupBy(rows,xk);
  xs.forEach(x=>{
    const sub=bx.get(x)||[];
    const bs=sk?groupBy(sub,sk):new Map([[null,sub]]);
    ss.forEach(s=>{
      const rs=bs.get(s)||[];
      const arr=yk?rs.map(r=>r[yk]):rs.map(()=>1);
      const key=x+"\u0000"+s;
      val[key]=yk?aggregate(arr,S.opts.agg):rs.length;
      err[key]=yk?errorOf(arr,S.opts.err):null;
      cnt[key]=rs.length;
    });
  });
  return {xs,ss,val,err,cnt,g:(x,s)=>val[x+"\u0000"+s],e:(x,s)=>err[x+"\u0000"+s],n:(x,s)=>cnt[x+"\u0000"+s]};
}
const errBarStyle = ()=>({type:"data",visible:true,thickness:pt2px(S.style.fs)*.11+.7,width:3,color:"#444"});
function trendTrace(x,y,color){
  const o=S.opts; if(o.trend==="none") return [];
  const px=[],py=[]; const pairs=x.map((v,i)=>[v,y[i]]).filter(p=>isFinite(p[0])&&isFinite(p[1]));
  if(pairs.length<3) return [];
  const X=pairs.map(p=>p[0]),Y=pairs.map(p=>p[1]);
  if(o.trend==="loess"){
    const L=loessish(X,Y,.6);
    return [{type:"scatter",mode:"lines",x:L.x,y:L.y,line:{color,width:S.opts.lineWidth,dash:"solid"},name:"Smoothed fit",showlegend:false,hoverinfo:"skip"}];
  }
  const f=linreg(X,Y);
  const x0=Math.min(...X),x1=Math.max(...X);
  return [{type:"scatter",mode:"lines",x:[x0,x1],y:[f.m*x0+f.b,f.m*x1+f.b],
    line:{color,width:S.opts.lineWidth,dash:"dash"},name:"Linear fit",showlegend:false,hoverinfo:"skip",
    _fit:f}];
}

const B = {};

/* ---- bar family ---- */
B.bar=(c)=>{
  const {rows,R}=c, o=S.opts, T=agTable(rows,R("x"),R("series"),R("y"));
  const tot={}; T.xs.forEach(x=>tot[x]=sum(T.ss.map(s=>T.g(x,s)||0)));
  const xs=sortLevels(T.xs,tot,o.sort);
  const H=o.orient==="h";
  const data=T.ss.map((s,i)=>{
    const v=xs.map(x=>T.g(x,s)), e=xs.map(x=>T.e(x,s));
    const t={type:"bar",name:s==null?(R("y")||"Value"):nm(s),
      marker:{color:pal(i),line:{width:0}},opacity:S.opts.opacity};
    if(H){t.y=xs.map(nm);t.x=v;t.orientation="h";if(e.some(q=>q!=null))t.error_x={...errBarStyle(),array:e};}
    else {t.x=xs.map(nm);t.y=v;if(e.some(q=>q!=null))t.error_y={...errBarStyle(),array:e};}
    if(o.labelBars){t.text=v.map(fmtN);t.textposition="outside";t.textfont={size:pt2px(S.style.fsTick)};}
    return t;
  });
  return {data,layout:{barmode:"group",bargap:o.barGap,bargroupgap:.08},
    autoTitles:{x:R("x"),y:R("y")?`${o.agg==="mean"?"Mean ":""}${R("y")}`:"Count"}};
};
B.barstack=(c)=>{const f=B.bar(c);f.data.forEach(t=>{delete t.error_y;delete t.error_x;});f.layout.barmode="stack";return f;};
B.bar100=(c)=>{
  const {rows,R}=c,o=S.opts,T=agTable(rows,R("x"),R("series"),R("y"));
  const xs=T.xs, tot={}; xs.forEach(x=>tot[x]=sum(T.ss.map(s=>T.g(x,s)||0))||1);
  const H=o.orient==="h";
  const data=T.ss.map((s,i)=>{
    const v=xs.map(x=>100*(T.g(x,s)||0)/tot[x]);
    const t={type:"bar",name:s==null?"Value":nm(s),marker:{color:pal(i)},opacity:S.opts.opacity,
      text:v.map(q=>q>7?q.toFixed(0)+"%":""),textposition:"inside",insidetextfont:{size:pt2px(S.style.fsTick),color:"#fff"}};
    if(H){t.y=xs.map(nm);t.x=v;t.orientation="h";}else{t.x=xs.map(nm);t.y=v;}
    return t;});
  return {data,layout:{barmode:"stack",bargap:o.barGap},
    autoTitles:{x:H?"Share of responses (%)":R("x"),y:H?R("x"):"Share of responses (%)"}};
};
B.line=(c)=>{
  const {rows,R}=c,o=S.opts,ys=[].concat(R("y")||[]).filter(Boolean),sk=R("series");
  const data=[];
  if(sk){
    const T=agTable(rows,R("x"),sk,ys[0]);
    T.ss.forEach((s,i)=>{
      const e=T.xs.map(x=>T.e(x,s));
      data.push({type:"scatter",mode:o.showPoints?"lines+markers":"lines",name:nm(s),
        x:T.xs.map(nm),y:T.xs.map(x=>T.g(x,s)),
        line:{color:pal(i),width:o.lineWidth,shape:o.curve},marker:{size:o.markerSize,color:pal(i)},
        error_y:e.some(q=>q!=null)?{...errBarStyle(),array:e,color:pal(i)}:undefined});

function scatterCore(c,sizeRole){
  const {rows,R}=c,o=S.opts,xk=R("x"),yk=R("y"),ck=R("color"),lk=R("label"),zk=sizeRole?R("size"):null;
  const valid=rows.filter(r=>isFinite(r[xk])&&isFinite(r[yk])&&(!zk||isFinite(r[zk])));
  const sz=v=>{if(!zk)return o.markerSize;
    const a=valid.map(r=>r[zk]),mn=Math.min(...a),mx=Math.max(...a);
    return 5+Math.sqrt((v-mn)/((mx-mn)||1))*(o.markerSize*3.4);};
  const data=[];
  const ccol=ck?findCol(ck):null;
  if(ccol&&ccol.type!=="num"){
    levelsOf(valid,ck).forEach((g,i)=>{
      const sub=valid.filter(r=>String(r[ck])===g);
      data.push({type:"scatter",mode:lk?"markers+text":"markers",name:nm(g),
        x:sub.map(r=>r[xk]),y:sub.map(r=>r[yk]),
        text:lk?sub.map(r=>String(r[lk])):undefined,textposition:"top center",textfont:{size:pt2px(S.style.fsTick)},
        marker:{color:pal(i),size:zk?sub.map(r=>sz(r[zk])):o.markerSize,opacity:o.opacity,line:{width:.6,color:"#fff"}}});
    });
  } else {
    data.push({type:"scatter",mode:lk?"markers+text":"markers",name:yk,showlegend:false,
      x:valid.map(r=>r[xk]),y:valid.map(r=>r[yk]),
      text:lk?valid.map(r=>String(r[lk])):undefined,textposition:"top center",textfont:{size:pt2px(S.style.fsTick)},
      marker:{size:zk?valid.map(r=>sz(r[zk])):o.markerSize,opacity:o.opacity,
        color:ccol?valid.map(r=>r[ck]):pal(0),
        colorscale:ccol?SCALES[S.style.scale]:undefined,
        showscale:!!ccol,colorbar:ccol?{title:{text:ck,side:"right"},thickness:9,len:.8}:undefined,
        line:{width:.6,color:"#fff"}}});
  }
  let fit=null;
  if(!sizeRole||true){
    const tr=trendTrace(valid.map(r=>r[xk]),valid.map(r=>r[yk]),"#333");
    if(tr[0]){fit=tr[0]._fit;data.push(tr[0]);}
  }
  const notes=[];
  if(o.showR2&&fit) notes.push(`R² = ${fit.r2.toFixed(3)}, r = ${fit.r.toFixed(3)}, n = ${valid.length}`);
  return {data,layout:{},autoTitles:{x:xk,y:yk},corner:notes};
}

B.diverging=(c)=>{

  const base={};items.forEach(x=>{

    if(nL%2===1) b-=P(x,lv[Math.floor(nL/2)])/2;

    const t=i<half?i/Math.max(1,half-1):(i>half||nL%2===0?(i-half-(nL%2?1:0))/Math.max(1,nL-half-1):0);
    const col=nL%2===1&&i===half?"#B8BDB6":(i<half?shade(pal(0),.72-t*.5):shade(pal(2),.3+t*.45));

  items.forEach(g=>{
    const sub=rows.filter(r=>String(r[lk])===g), a=num(sub.map(r=>r[ek]));

    if(lo&&hi){em.push(m-sub[0][lo]);ep.push(sub[0][hi]-m);}
    else{const e=errorOf(a,o.err==="none"?"ci95":o.err)||0;em.push(e);ep.push(e);}
  });
  return {data:[{type:"scatter",mode:"markers",showlegend:false,x:est,y:items.map(nm),
    marker:{color:pal(0),size:o.markerSize+3,symbol:"square"},
    error_x:{type:"data",array:ep,arrayminus:em,visible:true,thickness:1.2,width:3.5,color:"#16242B"}}],
    layout:{shapes:[{type:"line",x0:Number(o.refLine)||0,x1:Number(o.refLine)||0,yref:"paper",y0:0,y1:1,
      line:{color:"#8C9490",width:1,dash:"dash"}}]},

B.waffle=(c)=>{
  const {rows,R}=c,T=agTable(rows,R("x"),null,R("y"));
  const vals=T.xs.map(x=>T.g(x,null)),tot=sum(vals)||1;
  let cells=vals.map(v=>Math.round(100*v/tot));
  let d=100-sum(cells); if(d) cells[cells.indexOf(Math.max(...cells))]+=d;
  const data=[];let k=0;
  T.xs.forEach((g,i)=>{
    const xs=[],ys=[];
    for(let q=0;q<cells[i];q++){xs.push(k%10);ys.push(Math.floor(k/10));k++;}
    data.push({type:"scatter",mode:"markers",name:`${nm(g)} — ${cells[i]}%`,x:xs,y:ys,
      marker:{symbol:"square",size:S.opts.markerSize*2.4,color:pal(i),line:{width:1.6,color:"#fff"}}});
  });
  return {data,layout:{xaxis:{visible:false,range:[-.7,9.7],scaleanchor:"y",scaleratio:1},
    yaxis:{visible:false,range:[-.7,9.7],autorange:false}},autoTitles:{x:"",y:""},noGrid:true};

B.dotmatrix=(c)=>{

B.sankey=(c)=>{
  const {rows,R}=c,sk=R("source"),tk=R("target"),vk=R("value");
  const flows=new Map();
  rows.forEach(r=>{
    const a="◀"+String(r[sk]??"(blank)"),b="▶"+String(r[tk]??"(blank)");
    const v=vk?(Number(r[vk])||0):1, k=a+"\u0000"+b;
    flows.set(k,(flows.get(k)||0)+v);
  });
  const labels=[],idx=new Map();
  const id=l=>{if(!idx.has(l)){idx.set(l,labels.length);labels.push(l);}return idx.get(l);};
  const src=[],tgt=[],val=[];
  [...flows.entries()].forEach(([k,v])=>{const [a,b]=k.split("\u0000");src.push(id(a));tgt.push(id(b));val.push(v);});
  return {data:[{type:"sankey",orientation:"h",
    node:{label:labels.map(l=>nm(l.slice(1))),pad:11,thickness:12,line:{color:"#fff",width:.8},
      color:labels.map((_,i)=>pal(i))},
    link:{source:src,target:tgt,value:val,color:src.map(i=>hexA(pal(i),.34))},
    textfont:{size:pt2px(S.style.fs),family:S.style.font}}],
    layout:{},noAxes:true};
};
function hierData(c){
  const {rows,R}=c,keys=[R("l1"),R("l2"),R("l3")].filter(Boolean),vk=R("value");
  const agg=new Map();
  rows.forEach(r=>{
    let path="";
    keys.forEach(k=>{
      const parent=path; path=path?path+"|"+String(r[k]??"(blank)"):String(r[k]??"(blank)");
      if(!agg.has(path)) agg.set(path,{id:path,parent,label:String(r[k]??"(blank)"),v:0});
      agg.get(path).v+=vk?(Number(r[vk])||0):1;
    });
  });
  const a=[...agg.values()];
  return {ids:a.map(x=>x.id),labels:a.map(x=>nm(x.label)),parents:a.map(x=>x.parent),
    values:a.map(x=>x.v)};
}

B.heatmap=(c)=>{
  const {rows,R}=c,xk=R("x"),yk=R("y"),zk=R("z");
  const xs=levelsOf(rows,xk),ys=levelsOf(rows,yk);
  const z=ys.map(y=>xs.map(x=>{
    const sub=rows.filter(r=>String(r[xk])===x&&String(r[yk])===y);
    if(!sub.length) return null;
    return zk?aggregate(sub.map(r=>r[zk]),S.opts.agg):sub.length;}));
  const flat=z.flat().filter(v=>v!=null);
  return {data:[{type:"heatmap",x:xs.map(nm),y:ys.map(nm),z,colorscale:SCALES[S.style.scale],
    xgap:1,ygap:1,hoverongaps:false,
    colorbar:{title:{text:zk||"Count",side:"right",font:{size:pt2px(S.style.fs)}},thickness:9,len:.85,
      tickfont:{size:pt2px(S.style.fsTick)},outlinewidth:0},
    text:S.opts.annotateCells?z.map(r=>r.map(v=>v==null?"":fmtN(v))):undefined,
    texttemplate:S.opts.annotateCells?"%{text}":undefined,
    textfont:{size:pt2px(S.style.fsTick)}}],
    layout:{},autoTitles:{x:xk,y:yk},noGrid:true,
    corner:flat.length?[`range ${fmtN(Math.min(...flat))} – ${fmtN(Math.max(...flat))}`]:[]};

B.stream=(c)=>{

  const base=xs.map((x,k)=>-tot[k]/2);
  const run=[...base],data=[];
  ss.forEach((s,i)=>{

      hoverinfo:"name"});

B.upset=(c)=>{
  const {rows,R}=c;
  const sets=[].concat(R("sets")||[]).filter(Boolean);
  const truthy=v=>{const s=String(v??"").trim().toLowerCase();
    return !(s===""||s==="0"||s==="no"||s==="false"||s==="n"||s==="na"||s==="null"||s==="(blank)");};
  const combos=new Map();
  rows.forEach(r=>{
    const sig=sets.map(k=>truthy(r[k])?1:0);
    if(!sum(sig)) return;
    const key=sig.join("");
    combos.set(key,(combos.get(key)||0)+1);
  });
  let list=[...combos.entries()].map(([k,v])=>({k,v,sig:k.split("").map(Number)}));
  list.sort((a,b)=>b.v-a.v);
  if(S.opts.topN>0) list=list.slice(0,S.opts.topN); else list=list.slice(0,14);
  const setTot=sets.map((k,i)=>sum(list.map(l=>l.sig[i]?l.v:0)));
  const N=sets.length, xs=list.map((_,i)=>i);
  const bars={type:"bar",x:xs,y:list.map(l=>l.v),xaxis:"x",yaxis:"y",showlegend:false,
    marker:{color:pal(0)},text:list.map(l=>l.v),textposition:"outside",
    textfont:{size:pt2px(S.style.fsTick)},width:.62};
  const on=[],onY=[],off=[],offY=[],lines=[];
  list.forEach((l,i)=>{
    const idxs=[];
    l.sig.forEach((b,j)=>{ if(b){on.push(i);onY.push(N-1-j);idxs.push(N-1-j);} else {off.push(i);offY.push(N-1-j);} });
    if(idxs.length>1) lines.push({type:"line",xref:"x2",yref:"y2",x0:i,x1:i,
      y0:Math.min(...idxs),y1:Math.max(...idxs),line:{color:"#16242B",width:1.8}});
  });
  const dots=[
    {type:"scatter",mode:"markers",x:off,y:offY,xaxis:"x2",yaxis:"y2",showlegend:false,hoverinfo:"skip",
      marker:{size:S.opts.markerSize+2,color:"#DCDED8"}},
    {type:"scatter",mode:"markers",x:on,y:onY,xaxis:"x2",yaxis:"y2",showlegend:false,
      marker:{size:S.opts.markerSize+2,color:"#16242B"}}];
  return {data:[bars,...dots],
    layout:{shapes:lines,
      xaxis:{domain:[0,1],anchor:"y",showticklabels:false,showline:false,ticks:"",zeroline:false,range:[-.6,list.length-.4]},
      yaxis:{domain:[.44,1],anchor:"x",title:{text:"Cases in intersection"},zeroline:false},
      xaxis2:{domain:[0,1],anchor:"y2",showticklabels:false,showline:false,ticks:"",zeroline:false,showgrid:false,range:[-.6,list.length-.4]},
      yaxis2:{domain:[0,.36],anchor:"x2",tickvals:sets.map((_,j)=>N-1-j),
        ticktext:sets.map((s,i)=>`${nm(s)} (${setTot[i]})`),showgrid:false,zeroline:false,showline:false,ticks:"",
        range:[-.7,N-.3]}},
    autoTitles:{x:"",y:"Cases in intersection"},multiAxis:true,
    corner:[`${list.length} intersections shown, ${rows.length} cases`]};
};
function hexA(hex,a){
  const h=String(hex).replace("#","");
  const n=h.length===3?h.split("").map(x=>x+x).join(""):h;
  const r0=parseInt(n.slice(0,2),16),g0=parseInt(n.slice(2,4),16),b0=parseInt(n.slice(4,6),16);
  return `rgba(${r0},${g0},${b0},${a})`;
}
function shade(hex,t){ // t 0..1 → toward white as t grows
  const h=String(hex).replace("#","");
  const n=h.length===3?h.split("").map(x=>x+x).join(""):h;
  const c=[0,2,4].map(i=>parseInt(n.slice(i,i+2),16));
  const m=c.map(v=>Math.round(v+(255-v)*Math.max(0,Math.min(1,t))*.78));
  return `rgb(${m[0]},${m[1]},${m[2]})`;
}

/* ============================================================
   F. THEME + RENDER
   ============================================================ */
function figPx(){
  const st=S.style;
  return {w:Math.round(mm2px(st.wmm)), h:Math.round(mm2px(st.hmm))};
}
function axisBase(th,dark){
  return {
    showgrid:false, gridcolor:dark?"#33454C":"#E7E9E3", gridwidth:.8,
    zeroline:false, zerolinecolor:dark?"#5B6E75":"#C9CCC4",
    showline:!!th.ticks||th.frame, linecolor:dark?"#C6D2D6":"#16242B", linewidth:1,
    mirror:th.mirror, ticks:th.ticks||"", tickcolor:dark?"#C6D2D6":"#16242B",
    ticklen:3, tickwidth:.9, automargin:true
  };
}
function finish(fig){
  const st=S.style,o=S.opts,lab=S.lab,th=THEMES[st.theme],dark=!!th.dark;
  const {w,h}=figPx();
  const ink=dark?"#EAF0F1":"#16242B";
  const L=Object.assign({
    width:w,height:h,
    paper_bgcolor:dark?"#16242B":"#FFFFFF",
    plot_bgcolor:dark?"#16242B":"#FFFFFF",
    font:{family:st.font+", sans-serif",size:pt2px(st.fs),color:ink},
    margin:{t:12,r:12,b:12,l:12,pad:1},
    hovermode:"closest",
    colorway:PAL(),
  },fig.layout||{});

  if(!fig.noAxes){
    const base=axisBase(th,dark);
    const mkAx=(which,extra)=>Object.assign({},base,{
      showgrid: which==="y"?(th.gridY||th.grid):th.grid,
      title:{text:"",font:{size:pt2px(st.fs),color:ink},standoff:6},
      tickfont:{size:pt2px(st.fsTick),color:ink}
    },extra||{});
    const axKeys=new Set(["xaxis","yaxis"]);
    Object.keys(fig.layout||{}).forEach(k=>{if(/^[xy]axis\d*$/.test(k)) axKeys.add(k);});
    axKeys.forEach(k=>{
      const src=(fig.layout&&fig.layout[k])||{};
      L[k]=Object.assign(mkAx(k[0]), /\d/.test(k)?{showgrid:false}:{}, src);
    });
    if(fig.noGrid){L.xaxis.showgrid=false;L.yaxis.showgrid=false;}
    const at=fig.autoTitles||{};
    const xT=lab.xt!==""?lab.xt:(at.x||""), yT=lab.yt!==""?lab.yt:(at.y||"");
    if(fig.facet){
      L.annotations=(L.annotations||[]).concat([
        {xref:"paper",yref:"paper",x:.5,y:-.11,text:xT,showarrow:false,font:{size:pt2px(st.fs)}},
        {xref:"paper",yref:"paper",x:-.09,y:.5,text:yT,showarrow:false,textangle:-90,font:{size:pt2px(st.fs)}}]);
    } else { L.xaxis.title.text=xT; L.yaxis.title.text=yT; }
    if(o.logX&&fig.catAxis!=="x") L.xaxis.type="log";
    if(o.logY&&fig.catAxis!=="y") L.yaxis.type="log";
    const rng=(k,a,b)=>{const A=parseFloat(a),Bv=parseFloat(b);
      if(isFinite(A)&&isFinite(Bv)) L[k].range=[A,Bv];};
    rng("xaxis",o.xMin,o.xMax); rng("yaxis",o.yMin,o.yMax);
    if(o.flipY) L.yaxis.autorange="reversed";
    if(o.refLine!==""&&isFinite(parseFloat(o.refLine))&&S.chart!=="forest"){
      L.shapes=(L.shapes||[]).concat([{type:"line",xref:"paper",x0:0,x1:1,
        y0:parseFloat(o.refLine),y1:parseFloat(o.refLine),line:{color:"#8C9490",width:1,dash:"dot"}}]);
    }
  }

  /* title */
  if(lab.title){
    L.title={text:lab.title,font:{size:pt2px(st.fsTitle),color:ink,family:st.font},
      x:0,xanchor:"left",y:1,yanchor:"top",pad:{t:2,l:2}};
  }
  /* legend */
  L.showlegend = st.showLegend && (L.showlegend!==false) && fig.data.some(t=>t.showlegend!==false&&t.name);
  const lg={font:{size:pt2px(st.fsTick),color:ink},bgcolor:"rgba(0,0,0,0)",borderwidth:0,
    title:{text:lab.lt||"",font:{size:pt2px(st.fsTick),color:ink}},itemsizing:"constant",tracegroupgap:2};
  const P={top:{orientation:"h",x:0,xanchor:"left",y:1.02,yanchor:"bottom"},
           bottom:{orientation:"h",x:0,xanchor:"left",y:-.16,yanchor:"top"},
           right:{orientation:"v",x:1.02,xanchor:"left",y:1,yanchor:"top"},
           inside:{orientation:"v",x:.99,xanchor:"right",y:.99,yanchor:"top",bgcolor:dark?"rgba(22,36,43,.72)":"rgba(255,255,255,.75)"}};
  L.legend=Object.assign(lg,P[st.legend]||P.top);

  /* margins */
  const m=st.margin;
  L.margin={t:Math.round((lab.title?pt2px(st.fsTitle)*2.2:8)+(L.showlegend&&st.legend==="top"?pt2px(st.fsTick)*2.4:4))*m,
    r:Math.round((st.legend==="right"&&L.showlegend?58:10)*m),
    b:Math.round((L.showlegend&&st.legend==="bottom"?42:26)*m),
    l:Math.round(46*m),pad:1};
  if(fig.wideMargins){L.margin.l=Math.round(64*m);L.margin.r=Math.round(64*m);}
  if(fig.noAxes){L.margin={t:L.margin.t,r:14,b:14,l:14,pad:2};}

  /* corner note (R², n, bin width …) */
  L.annotations=(L.annotations||[]).slice();
  if(fig.corner&&fig.corner.length&&o.showR2){
    L.annotations.push({xref:"paper",yref:"paper",x:.99,y:.02,xanchor:"right",yanchor:"bottom",
      text:fig.corner.join("<br>"),showarrow:false,align:"right",
      font:{size:pt2px(st.fsTick),color:dark?"#B7C4C8":"#4C5F66"}});
  }
  /* free annotations */
  S.notes.forEach(n=>{
    if(!n.text) return;
    L.annotations.push({xref:"paper",yref:"paper",x:Number(n.x)/100,y:Number(n.y)/100,
      xanchor:"center",yanchor:"middle",text:n.text,showarrow:false,
      font:{size:pt2px(n.size||st.fs),color:n.color||ink},align:"center",
      bgcolor:n.box?(dark?"rgba(22,36,43,.8)":"rgba(255,255,255,.8)"):undefined});
  });
  /* significance brackets */
  if(!fig.noAxes&&S.sig.length){
    const ys=fig.data.flatMap(t=>Array.isArray(t.y)?t.y.filter(v=>typeof v==="number"):[]);
    const top=ys.length?Math.max(...ys):1, span=(top-(ys.length?Math.min(...ys,0):0))||1;
    const posOf=(labl)=>{
      const ax=(fig.layout&&fig.layout.xaxis)||{};
      if(ax.ticktext){const i=ax.ticktext.indexOf(labl);if(i>=0)return ax.tickvals[i];}
      for(const t of fig.data){
        if(Array.isArray(t.x)){const i=t.x.indexOf(labl);if(i>=0)return i;}
      }
      return labl;
    };
    S.sig.forEach((b,i)=>{
      if(!b.a||!b.b) return;
      const yy=top+span*(.07+.1*i), tick=span*.022;
      const x0=posOf(b.a),x1=posOf(b.b);
      L.shapes=(L.shapes||[]).concat([
        {type:"line",x0,x1,y0:yy,y1:yy,line:{color:ink,width:1}},
        {type:"line",x0,x1:x0,y0:yy,y1:yy-tick,line:{color:ink,width:1}},
        {type:"line",x0:x1,x1,y0:yy,y1:yy-tick,line:{color:ink,width:1}}]);
      L.annotations.push({x:x0,y:yy,xshift:0,yshift:2,showarrow:false,text:b.label||"*",
        xanchor:"center",yanchor:"bottom",font:{size:pt2px(st.fsTick),color:ink},
        xref:"x",yref:"y",ax:0,ay:0,
        ...(typeof x0==="number"&&typeof x1==="number"?{x:(x0+x1)/2}:{})});
    });
  }
  return {data:fig.data,layout:L};
}

let CURRENT=null, STAGED=false;
const msg=(col,html)=>`<div style="height:100%;display:flex;align-items:center;justify-content:center;
  padding:22px;text-align:center;color:${col};font-size:12px;line-height:1.55">${html}</div>`;
function stageScaffold(){
  const {w,h}=figPx();
  document.getElementById("stage").innerHTML=`
    <div class="platewrap" id="platewrap" style="width:${w}px">
      <div class="mmrule" id="mmrule">${ruleSVG(S.style.wmm,w)}</div>
      <div class="plate" id="plate" style="width:${w}px;height:${h}px">
        <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>
        <div id="plot"></div>
        <div class="grab" id="grab" title="Drag to resize the figure"></div>
      </div>
      <div class="platefoot">
        <div class="cap" id="capOut"></div>
        <div class="dims" id="dimsOut"></div>
      </div>
    </div>`;
  STAGED=true; wireStage();
}
function render(){
  if(!S.ready){document.getElementById("stage").innerHTML=blankHTML();STAGED=false;wireBlank();return;}
  if(!STAGED||!document.getElementById("plot")) stageScaffold();
  const {w,h}=figPx();
  document.getElementById("platewrap").style.width=w+"px";
  const pl=document.getElementById("plate"); pl.style.width=w+"px"; pl.style.height=h+"px";
  document.getElementById("mmrule").innerHTML=ruleSVG(S.style.wmm,w);
  const gd=document.getElementById("plot"), spec=CH(S.chart);
  const missing=spec.roles.filter(r0=>r0.req&&!S.roles[r0.k]);
  const bail=html=>{try{Plotly.purge(gd);}catch(e){} gd.innerHTML=html; gd._wired=false; updateFoot();};
  if(missing.length){
    return bail(msg("var(--paper-dim)",
      `Drop ${missing.map(m=>"<b style='color:var(--paper-ink)'>"+m.label.toLowerCase()+"</b>").join(" and ")} into the slots on the right.`));
  }
  let fig;
  try{ fig=finish(B[S.chart]({rows:activeRows(),R:k=>S.roles[k]})); }
  catch(err){ return bail(msg("#9E1B32",
    `${spec.name} can't be built from these columns.<br><span style="color:var(--paper-dim)">${escapeHTML(String(err.message||err)).slice(0,150)}</span>`)); }
  CURRENT=fig;
  Plotly.react(gd,fig.data,fig.layout,{displayModeBar:false,responsive:false});
  if(!gd._wired){ gd.addEventListener("click",onPlotClick); gd._wired=true; }
  updateFoot();
  document.getElementById("btnExport").disabled=false;
}
function ruleSVG(wmm,wpx){
  let t="";
  const step=wmm>150?20:10;
  for(let m=0;m<=wmm;m+=step){
    const x=(m/wmm)*wpx;
    t+=`<line x1="${x}" y1="13" x2="${x}" y2="6" stroke="currentColor" stroke-width="1"/>`;
    t+=`<text x="${x+2}" y="7" font-size="8" fill="currentColor" font-family="IBM Plex Mono,monospace">${m}</text>`;
  }
  for(let m=0;m<=wmm;m+=step/5){
    const x=(m/wmm)*wpx;
    t+=`<line x1="${x}" y1="13" x2="${x}" y2="10" stroke="currentColor" stroke-width=".6" opacity=".6"/>`;
  }
  return `<svg viewBox="0 0 ${wpx} 13" preserveAspectRatio="none">${t}</svg>`;
}
function updateFoot(){
  const st=S.style,{w,h}=figPx();
  const cap=document.getElementById("capOut");
  if(cap) cap.className="cap"+(S.lab.cap?"":" empty");
  if(cap) cap.innerHTML=S.lab.cap? `<b>Fig. ${escapeHTML(S.lab.fignum||"1")}.</b> ${escapeHTML(S.lab.cap)}`
    : `Fig. ${escapeHTML(S.lab.fignum||"1")}. — write a caption in the Labels panel.`;
  const d=document.getElementById("dimsOut");
  if(d) d.innerHTML=[`${st.wmm} × ${st.hmm} mm`,
    `${Math.round(st.wmm/MM*st.dpi)} × ${Math.round(st.hmm/MM*st.dpi)} px at ${st.dpi} dpi`,
    `body text ${st.fs} pt`,`n = ${activeRows().length}`].map(x=>`<span>${x}</span>`).join("");
}
const escapeHTML=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

/* ============================================================
   G. EXPORT
   ============================================================ */
function exportImage(fmt){
  const gd=document.getElementById("plot");
  if(!gd||!gd.data){toast("Draw a plot first.");return;}
  const {w,h}=figPx(), scale=fmt==="svg"?1:S.style.dpi/CSSPPI;
  const base=(S.lab.title||S.chart||"figure").replace(/[^\w-]+/g,"_").slice(0,50).toLowerCase();
  Plotly.downloadImage(gd,{format:fmt,width:w,height:h,scale,
    filename:`${base}_${S.style.wmm}mm_${fmt==="svg"?"vector":S.style.dpi+"dpi"}`})
    .then(()=>toast(fmt==="svg"?"Vector SVG saved.":`PNG saved at ${S.style.dpi} dpi.`))
    .catch(()=>toast("The browser blocked the download. Try again."));
}
async function copyFigure(){
  const gd=document.getElementById("plot");
  const {w,h}=figPx();
  try{
    const url=await Plotly.toImage(gd,{format:"png",width:w,height:h,scale:S.style.dpi/CSSPPI});
    const blob=await (await fetch(url)).blob();
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
    toast("Figure copied to the clipboard.");
  }catch(e){toast("This browser won't allow clipboard images. Use Save PNG.");}
}
function downloadText(name,text,mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime||"text/plain"}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportPlottedCSV(){
  if(!CURRENT){toast("Draw a plot first.");return;}
  const rowsOut=[];
  CURRENT.data.forEach((t,i)=>{
    const n=Math.max(t.x?.length||0,t.y?.length||0,t.values?.length||0,t.r?.length||0);
    for(let k=0;k<n;k++){
      rowsOut.push({series:t.name||`trace_${i+1}`,
        x:Array.isArray(t.x)?t.x[k]:(t.labels?t.labels[k]:""),
        y:Array.isArray(t.y)?t.y[k]:(t.values?t.values[k]:(t.r?t.r[k]:"")),
        error:t.error_y?.array?.[k] ?? t.error_x?.array?.[k] ?? ""});
    }
  });
  const head="series,x,y,error\n";
  const body=rowsOut.map(r0=>[r0.series,r0.x,r0.y,r0.error]
    .map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  downloadText("plotted_values.csv",head+body,"text/csv");
  toast("Plotted values saved — attach as supplementary data.");
}
function saveConfig(){
  downloadText("graphinator_figure.json",JSON.stringify({
    chart:S.chart,roles:S.roles,opts:S.opts,style:S.style,lab:S.lab,
    notes:S.notes,sig:S.sig,filters:S.filters,order:S.order,off:[...S.off],sheet:S.sheet},null,2),"application/json");
  toast("Figure recipe saved. Reload it with any file that has the same columns.");
}
function loadConfig(txt){
  try{
    const j=JSON.parse(txt);
    Object.assign(S.opts,j.opts||{});Object.assign(S.style,j.style||{});
    Object.assign(S.lab,j.lab||{});S.roles=j.roles||{};S.chart=j.chart||S.chart;
    S.notes=j.notes||[];S.sig=j.sig||[];S.order=j.order||{};S.filters=j.filters||[];S.off=new Set(j.off||[]);
    buildUI();render();toast("Figure recipe loaded.");
  }catch(e){toast("That file isn't a Graphinator recipe.");}
}

/* ---------- recommendations ---------- */
function ranked(){
  const p=profile();
  return CHARTS.map(c=>({c,s:c.fit(p)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
}
function recHTML(){
  if(!S.ready) return `<p class="hint">Load a sheet and the machine ranks every plot against the shape of your data.</p>`;
  const R=ranked();
  const row=x=>`<button class="rec ${x.c.tier}" data-chart="${x.c.id}" data-peek="${x.c.id}"
      aria-pressed="${S.chart===x.c.id}">

      <span class="fitbar"><i style="width:${x.s}%"></i></span></button>`;
  const grp=(t,n)=>R.filter(x=>x.c.tier===t).slice(0,n);

}

/* ---------- role mapping ---------- */
function colsFor(kind){
  if(kind==="num") return colsOf("num");
  if(kind==="cat") return [...colsOf("cat"),...colsOf("time")];
  if(kind==="time") return colsOf("time");
  return activeCols();
}
function looksLikeId(c){
  const n=c.name.toLowerCase().replace(/[^a-z]/g,"");
  return /^(id|no|sno|srno|serial|index|idx|code|participant|respondent|subject|case|uid)$/.test(n)
      || /(^|_)id$/.test(c.name.toLowerCase());
}
function catScore(c,nRows){
  if(looksLikeId(c)||c.card>=nRows*0.9) return -50;
  if(c.card<2) return -20;
  if(c.card===2) return 52;
  if(c.card<=9) return 100-Math.abs(c.card-5)*3;
  if(c.card<=24) return 74-(c.card-9)*2;
  return Math.max(4,40-c.card*0.4);
}
function numScore(c,rows){
  if(looksLikeId(c)) return -50;
  const n=c.name.toLowerCase();
  let s=70;
  const vals=rows.map(r0=>r0[c.name]).filter(v=>typeof v==="number");
  const distinct=new Set(vals).size;
  if(/year|yr|month|date|round|wave|batch/.test(n)) s-=45;
  if(distinct<=2) s-=30; else if(distinct<=7) s-=12;
  s+=Math.min(26,distinct*0.6);
  const cv=c.sd&&c.mean?Math.abs(c.sd/c.mean):0;
  s+=Math.min(14,cv*38);
  return s;
}
const commonPrefix=(a,b)=>{let i=0;while(i<a.length&&i<b.length&&a[i].toLowerCase()===b[i].toLowerCase())i++;return i;};
function autoRoles(){
  const spec=CH(S.chart), rows=activeRows(), used=new Set(), out={};
  const cats=colsOf("cat"), nums=colsOf("num"), times=colsOf("time");
  const PAIR={y2:"y1",b:"a",c:"b"};
  const pairKeys=[["y1","y2"],["a","b"]].find(p=>spec.roles.some(x=>x.k===p[0])&&spec.roles.some(x=>x.k===p[1]));
  if(pairKeys&&nums.length>=2){
    let best=null;
    for(let i=0;i<nums.length;i++) for(let j=0;j<nums.length;j++){
      if(i===j) continue;
      const v=numScore(nums[i],rows)+numScore(nums[j],rows)+commonPrefix(nums[i].name,nums[j].name)*11;
      if(!best||v>best.v) best={v,i,j};
    }
    if(best){ out[pairKeys[0]]=nums[best.i].name; out[pairKeys[1]]=nums[best.j].name;
      used.add(nums[best.i].name); used.add(nums[best.j].name); }
  }
  spec.roles.forEach(r0=>{
    if(out[r0.k]) return;
    let pool = r0.kind==="num" ? nums
             : r0.kind==="cat" ? [...times,...cats]
             : r0.kind==="time" ? times
             : [...cats,...nums,...times];
    let free=pool.filter(c=>!used.has(c.name));
    if(!free.length){ if(!r0.req) return; free=pool; }
    if(!free.length) return;
    const score=c=>{
      let s = c.type==="num" ? numScore(c,rows) : catScore(c,rows.length);
      if(c.type==="time") s+=r0.kind==="cat"||r0.k==="x"?28:0;
      if(r0.k==="sets"&&c.card===2) s+=60;
      if(r0.k==="series"||r0.k==="color") s-= c.card>10?26:0;
      const partner=PAIR[r0.k]&&out[PAIR[r0.k]];
      if(partner) s+=commonPrefix(c.name,partner)*9;
      return s;
    };
    const ordered=[...free].sort((a,b)=>score(b)-score(a));
    if(r0.multi){
      let take;
      if(r0.k==="sets"){
        const bin=free.filter(c=>c.card===2);
        take=(bin.length>=2?bin:ordered).slice(0,7);
      } else take=free.filter(c=>!looksLikeId(c)).slice(0,6);
      if(take.length){ out[r0.k]=take.map(c=>c.name); take.forEach(c=>used.add(c.name)); }
    } else {
      const best=ordered[0];
      if(!r0.req && score(best)<0) return;
      out[r0.k]=best.name; used.add(best.name);
    }
  });
  S.roles=out;
}

function loadSample(){
  let seed=20260903;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const norm=(m,s)=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();
    return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const groups=["Design student","Practitioner","Educator"];
  const methods=["Affinity diagram","Morphological chart","TRIZ","Personas","QFD","Bodystorming","C-Sketch","Scenario mapping"];
  const themes=["Finding the right method","Judging method fit","Adapting to context","Teaching the method","Recording the outcome","Time pressure"];
  const stage=["Problem framing","Concept generation","Embodiment","Evaluation"];
  const scale=["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"];
  const rows=[];
  for(let i=1;i<=96;i++){
    const g=groups[i%3], base=g==="Practitioner"?71:g==="Educator"?76:64;
    const sus=Math.max(20,Math.min(100,Math.round(norm(base,12))));
    const pre=Math.max(1,Math.min(7,Math.round(norm(g==="Design student"?3.2:4.4,1.1))));
    const post=Math.max(1,Math.min(7,Math.round(pre+norm(1.5,.9))));
    const tA=Math.max(2,norm(g==="Practitioner"?9:13,3.4));
    const li=k=>scale[Math.max(0,Math.min(4,Math.round(norm(k,1.05))))];
    rows.push({
      Participant:"P"+String(i).padStart(3,"0"),
      Group:g,
      Method:pick(methods),
      Stage:pick(stage),
      Year:2021+(i%5),
      SUS_score:sus,
      Task_time_min:Math.round(tA*10)/10,
      Errors:Math.max(0,Math.round(norm(2.2,1.5))),
      Confidence_pre:pre,
      Confidence_post:post,
      Coder_A_rating:Math.max(1,Math.min(7,Math.round(norm(4.5,1.2)))),
      Coder_B_rating:Math.max(1,Math.min(7,Math.round(norm(4.4,1.3)))),
      Primary_theme:pick(themes),
      Secondary_theme:pick(themes),
      Ease_of_use:li(g==="Educator"?3.4:2.9),
      Would_recommend:li(3.3),
      Theme_retrieval:rnd()<.62?1:0,
      Theme_fit:rnd()<.48?1:0,
      Theme_adaptation:rnd()<.4?1:0,
      Theme_teaching:rnd()<(g==="Educator"?.72:.26)?1:0,
    });
  }
  S.sheets={"Example study":rows};
  S.fileName="example_study.xlsx";
  loadSheet("Example study");
  S.chart="raincloud"; autoRoles();
  S.lab.cap="";
  buildUI(); render(); toast("Example data loaded. Try the underused plots.");
}

  const aggTxt={mean:"Mean",median:"Median",sum:"Total",count:"Count of",min:"Minimum",max:"Maximum",n_unique:"Number of distinct"}[o.agg];
  let s="";

  switch(S.chart){

      s=`Distribution of ${pretty(R("y"))}${R("x")?` by ${pretty(R("x"))}`:""}. `+

        (o.trend!=="none"?"The dashed line is a least-squares fit. ":"");break;
    case "corr": s=`Pairwise ${o.smooth==="spearman"?"Spearman":"Pearson"} correlations among the measures. `;break;
    case "diverging": s=`Responses to each item on a five-point agreement scale, centred on the neutral category. `;break;

  }

/* ============================================================
   N. MATHS FOR THE BORROWED PLOTS
   ============================================================ */
function jacobiEigen(A0){
  const p=A0.length, A=A0.map(r0=>r0.slice());
  let V=A0.map((_,i)=>A0.map((__,j)=>i===j?1:0));
  for(let sweep=0;sweep<64;sweep++){
    let offd=0; for(let i=0;i<p;i++) for(let j=i+1;j<p;j++) offd+=A[i][j]*A[i][j];
    if(offd<1e-14) break;
    for(let i=0;i<p;i++) for(let j=i+1;j<p;j++){
      if(Math.abs(A[i][j])<1e-15) continue;
      const th=(A[j][j]-A[i][i])/(2*A[i][j]);
      const t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1));
      const c=1/Math.sqrt(t*t+1), s=t*c;
      for(let k=0;k<p;k++){
        const aik=A[i][k], ajk=A[j][k];
        A[i][k]=c*aik-s*ajk; A[j][k]=s*aik+c*ajk;
      }
      for(let k=0;k<p;k++){
        const aki=A[k][i], akj=A[k][j];
        A[k][i]=c*aki-s*akj; A[k][j]=s*aki+c*akj;
        const vki=V[k][i], vkj=V[k][j];
        V[k][i]=c*vki-s*vkj; V[k][j]=s*vki+c*vkj;
      }
    }
  }
  return {values:A.map((r0,i)=>r0[i]),vectors:V};
}
function pcaOf(rows,vars){
  const X=rows.filter(r0=>vars.every(v=>isFinite(r0[v]))).map(r0=>vars.map(v=>r0[v]));
  const n=X.length, p=vars.length;
  if(n<3||p<2) throw new Error("PCA needs at least three complete rows and two measures.");
  const mu=vars.map((_,j)=>mean(X.map(x=>x[j])));
  const sg=vars.map((_,j)=>sd(X.map(x=>x[j]))||1);
  const Z=X.map(x=>x.map((v,j)=>(v-mu[j])/sg[j]));
  const C=[];
  for(let i=0;i<p;i++){C.push([]);for(let j=0;j<p;j++){
    let s=0;for(let k=0;k<n;k++)s+=Z[k][i]*Z[k][j];C[i].push(s/(n-1));}}
  const {values,vectors}=jacobiEigen(C);
  const idx=values.map((v,i)=>i).sort((a,b)=>values[b]-values[a]);
  const ev=idx.map(i=>Math.max(0,values[i]));
  const V=idx.map(i=>vectors.map(rw=>rw[i]));
  const scores=Z.map(z=>V.map(v=>sum(z.map((q,j)=>q*v[j]))));
  const keep=rows.filter(r0=>vars.every(v=>isFinite(r0[v])));
  return {ev,V,scores,n,p,vars,keep,total:sum(ev)||1};
}
function posLevel(rows,key){
  const lv=levelsOf(rows,key);
  const want=(S.opts.posLabel||"").trim();
  if(want&&lv.includes(want)) return want;
  const auto=lv.find(v=>/^(1|yes|true|y|positive|pos|success|correct)$/i.test(v));
  return auto||lv[lv.length-1];
}
function rocOf(rows,scoreK,truthK){
  const pos=posLevel(rows,truthK);
  const d=rows.filter(r0=>isFinite(r0[scoreK])&&r0[truthK]!=null)
    .map(r0=>({s:r0[scoreK],y:String(r0[truthK])===pos?1:0}))
    .sort((a,b)=>b.s-a.s);
  const P=sum(d.map(x=>x.y)), N=d.length-P;
  if(!P||!N) throw new Error("The outcome column needs both a positive and a negative class.");
  const fpr=[0],tpr=[0],prec=[1],rec=[0],thr=[Infinity];
  let tp=0,fp=0;
  for(let i=0;i<d.length;i++){
    d[i].y?tp++:fp++;
    if(i<d.length-1&&d[i+1].s===d[i].s) continue;
    fpr.push(fp/N); tpr.push(tp/P); thr.push(d[i].s);
    rec.push(tp/P); prec.push(tp/(tp+fp));
  }
  const auc=(x,y)=>{let a=0;for(let i=1;i<x.length;i++)a+=(x[i]-x[i-1])*(y[i]+y[i-1])/2;return a;};
  return {fpr,tpr,prec,rec,thr,auc:auc(fpr,tpr),ap:Math.abs(auc(rec,prec)),pos,P,N};
}
function confusionOf(rows,aK,bK){
  const lv=[...new Set([...levelsOf(rows,aK),...levelsOf(rows,bK)])];
  const M=lv.map(()=>lv.map(()=>0));
  let tot=0;
  rows.forEach(r0=>{
    const i=lv.indexOf(String(r0[aK])), j=lv.indexOf(String(r0[bK]));
    if(i<0||j<0) return; M[i][j]++; tot++;
  });
  const diag=sum(lv.map((_,i)=>M[i][i]));
  const acc=tot?diag/tot:0;
  const pe=tot?sum(lv.map((_,i)=>(sum(M[i])/tot)*(sum(M.map(r0=>r0[i]))/tot))):0;
  const kappa=pe<1?(acc-pe)/(1-pe):0;

}
function forceLayout(n,edges,iters=300){
  const pos=[];
  for(let i=0;i<n;i++){const a=2*Math.PI*i/n;pos.push({x:Math.cos(a)*.42,y:Math.sin(a)*.42});}
  const k=Math.sqrt(1.4/Math.max(1,n)); let t=.14;
  for(let it=0;it<iters;it++){
    const d=pos.map(()=>({x:0,y:0}));
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
      let dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y;
      let r0=Math.hypot(dx,dy)||1e-4; const f=k*k/r0; dx/=r0; dy/=r0;
      d[i].x+=dx*f; d[i].y+=dy*f; d[j].x-=dx*f; d[j].y-=dy*f;
    }
    edges.forEach(e=>{
      let dx=pos[e.s].x-pos[e.t].x, dy=pos[e.s].y-pos[e.t].y;
      let r0=Math.hypot(dx,dy)||1e-4; const f=r0*r0/k*Math.min(3,e.w||1); dx/=r0; dy/=r0;
      d[e.s].x-=dx*f; d[e.s].y-=dy*f; d[e.t].x+=dx*f; d[e.t].y+=dy*f;
    });
    for(let i=0;i<n;i++){
      const m=Math.hypot(d[i].x,d[i].y)||1e-4;
      pos[i].x+=d[i].x/m*Math.min(m,t); pos[i].y+=d[i].y/m*Math.min(m,t);
      pos[i].x*=.992; pos[i].y*=.992;
    }

  }

}
function hclust(D){
  const n=D.length;
  let cl=D.map((_,i)=>({m:[i],h:0,id:i,l:null,r:null}));
  const merges=[];
  const dist=(a,b)=>{let s=0;a.m.forEach(i=>b.m.forEach(j=>s+=D[i][j]));return s/(a.m.length*b.m.length);};
  while(cl.length>1){
    let bi=0,bj=1,bd=Infinity;
    for(let i=0;i<cl.length;i++) for(let j=i+1;j<cl.length;j++){
      const d=dist(cl[i],cl[j]); if(d<bd){bd=d;bi=i;bj=j;}}
    const a=cl[bi],b=cl[bj];
    const node={m:[...a.m,...b.m],h:bd,l:a,r:b,id:-merges.length-1};
    merges.push(node);
    cl=cl.filter((_,i)=>i!==bi&&i!==bj); cl.push(node);
  }
  const order=[]; (function walk(nd){ if(!nd) return;
    if(!nd.l){order.push(nd.m[0]);return;} walk(nd.l); walk(nd.r);})(cl[0]);
  return {root:cl[0],order,merges};
}
function corrDist(rows,vars){
  const cols=vars.map(v=>rows.map(r0=>r0[v]));
  const ok=rows.map((_,i)=>cols.every(c=>isFinite(c[i])));
  const V=cols.map(c=>c.filter((_,i)=>ok[i]));
  return V.map(a=>V.map(b=>1-Math.abs(pearson(a,b)||0)));
}
function kaplanMeier(times,events){
  const d=times.map((t,i)=>({t,e:events[i]?1:0})).filter(x=>isFinite(x.t)).sort((a,b)=>a.t-b.t);
  let atRisk=d.length, s=1;
  const T=[0],Sv=[1],cens=[];
  for(let i=0;i<d.length;){
    const t=d[i].t; let ev=0,n=0;
    while(i<d.length&&d[i].t===t){ if(d[i].e) ev++; else cens.push(t); n++; i++; }
    if(ev){ s*= (1-ev/atRisk); T.push(t); Sv.push(s); }
    atRisk-=n;
  }
  return {T,S:Sv,cens,n:d.length,events:sum(d.map(x=>x.e))};
}
function chordRibbon(a0,a1,b0,b1,R){
  const P=(a,r0=R)=>[Math.cos(a)*r0,Math.sin(a)*r0];
  const arc=(s,e,steps=16)=>{const o=[];for(let i=0;i<=steps;i++)o.push(P(s+(e-s)*i/steps));return o;};
  const bez=(p0,p1,steps=22)=>{const o=[];
    for(let i=0;i<=steps;i++){const t=i/steps,u=1-t;
      o.push([u*u*p0[0]+2*u*t*0+t*t*p1[0], u*u*p0[1]+2*u*t*0+t*t*p1[1]]);}
    return o;};
  const pts=[...arc(a0,a1),...bez(P(a1),P(b0)),...arc(b0,b1),...bez(P(b1),P(a0))];
  return {x:pts.map(p=>p[0]),y:pts.map(p=>p[1])};
}
function edgeList(rows,sK,tK,wK){
  const nodes=[],idx=new Map();
  const id=l=>{if(!idx.has(l)){idx.set(l,nodes.length);nodes.push(l);}return idx.get(l);};
  const em=new Map();
  rows.forEach(r0=>{
    const a=String(r0[sK]??"(blank)"), b=String(r0[tK]??"(blank)");
    if(a===b&&S.opts.dropSelf) return;
    const s=id(a),t=id(b), k=s+"\u0000"+t;
    em.set(k,(em.get(k)||0)+(wK?(Number(r0[wK])||0):1));
  });
  const edges=[...em.entries()].map(([k,w])=>{const [s,t]=k.split("\u0000").map(Number);return {s,t,w};});
  const deg=nodes.map(()=>0);
  edges.forEach(e=>{deg[e.s]+=e.w;deg[e.t]+=e.w;});
  return {nodes,edges,deg};
}

B.confusion=(c)=>{
  const {rows,R}=c, K=confusionOf(rows,R("a"),R("b"));
  const z=K.lv.map((_,i)=>K.lv.map((__,j)=>K.M[i][j]));
  return {data:[{type:"heatmap",x:K.lv.map(nm),y:K.lv.map(nm),z,colorscale:SCALES[S.style.scale],
    xgap:1.5,ygap:1.5,
    colorbar:{title:{text:"Cases",side:"right",font:{size:pt2px(S.style.fs)}},thickness:9,len:.85,
      tickfont:{size:pt2px(S.style.fsTick)},outlinewidth:0},
    text:z.map(r0=>r0.map(String)),texttemplate:"%{text}",textfont:{size:pt2px(S.style.fsTick)}}],
    layout:{yaxis:{autorange:"reversed",scaleanchor:"x",scaleratio:1}},
    autoTitles:{x:R("b"),y:R("a")},noGrid:true,
    corner:[`agreement ${(K.acc*100).toFixed(1)}%, Cohen's κ = ${K.kappa.toFixed(3)}, n = ${K.tot}`]};
};
B.roc=(c)=>{
  const {rows,R}=c, K=rocOf(rows,R("score"),R("truth"));
  return {data:[
    {type:"scatter",mode:"lines",x:[0,1],y:[0,1],showlegend:false,hoverinfo:"skip",
      line:{color:"#9AA0A6",width:1,dash:"dash"}},
    {type:"scatter",mode:"lines",x:K.fpr,y:K.tpr,name:"ROC",showlegend:false,fill:"tozeroy",
      fillcolor:hexA(pal(0),.14),line:{color:pal(0),width:S.opts.lineWidth+.6,shape:"hv"}}],
    layout:{xaxis:{range:[0,1]},yaxis:{range:[0,1.02],scaleanchor:"x",scaleratio:1}},
    autoTitles:{x:"False positive rate (1 − specificity)",y:"True positive rate (sensitivity)"},
    corner:[`AUC = ${K.auc.toFixed(3)}`,`positive class: ${K.pos} (${K.P} of ${K.P+K.N})`]};
};
B.prcurve=(c)=>{
  const {rows,R}=c, K=rocOf(rows,R("score"),R("truth"));
  const base=K.P/(K.P+K.N);
  return {data:[
    {type:"scatter",mode:"lines",x:[0,1],y:[base,base],showlegend:false,hoverinfo:"skip",
      line:{color:"#9AA0A6",width:1,dash:"dash"}},
    {type:"scatter",mode:"lines",x:K.rec,y:K.prec,showlegend:false,fill:"tozeroy",
      fillcolor:hexA(pal(0),.14),line:{color:pal(0),width:S.opts.lineWidth+.6,shape:"hv"}}],
    layout:{xaxis:{range:[0,1]},yaxis:{range:[0,1.02]}},
    autoTitles:{x:"Recall",y:"Precision"},
    corner:[`average precision = ${K.ap.toFixed(3)}`,`baseline = ${base.toFixed(3)}`]};
};
B.network=(c)=>{
  const {rows,R}=c,o=S.opts;
  const G=edgeList(rows,R("source"),R("target"),R("value"));
  if(G.nodes.length>110) throw new Error("Too many nodes to lay out — filter or aggregate first.");
  const P=forceLayout(G.nodes.length,G.edges);
  const maxW=Math.max(...G.edges.map(e=>e.w),1), maxD=Math.max(...G.deg,1);
  const data=[];
  const buckets={};
  G.edges.forEach(e=>{
    const lw=Math.max(.4,(e.w/maxW)*(o.lineWidth+1.6));
    const k=lw.toFixed(2); (buckets[k]=buckets[k]||{x:[],y:[]});
    buckets[k].x.push(P[e.s].x,P[e.t].x,null);
    buckets[k].y.push(P[e.s].y,P[e.t].y,null);
  });
  Object.entries(buckets).forEach(([lw,b])=>data.push({type:"scatter",mode:"lines",x:b.x,y:b.y,
    showlegend:false,hoverinfo:"skip",line:{color:hexA("#16242B",.22),width:Number(lw)}}));
  data.push({type:"scatter",mode:"markers+text",x:P.map(p=>p.x),y:P.map(p=>p.y),
    text:G.nodes.map(nm),textposition:"top center",textfont:{size:pt2px(S.style.fsTick)},
    showlegend:false,cliponaxis:false,
    marker:{size:G.deg.map(d=>6+Math.sqrt(d/maxD)*(o.markerSize*2.4)),
      color:G.deg,colorscale:SCALES[S.style.scale],line:{width:1.1,color:"#fff"},opacity:.95}});
  return {data,layout:{xaxis:{visible:false},yaxis:{visible:false,scaleanchor:"x",scaleratio:1}},
    autoTitles:{x:"",y:""},noGrid:true,
    corner:[`${G.nodes.length} nodes, ${G.edges.length} edges`]};
};
B.bipartite=(c)=>{
  const {rows,R}=c,o=S.opts,sK=R("source"),tK=R("target"),vK=R("value");
  const L=levelsOf(rows,sK), Rt=levelsOf(rows,tK);
  const em=new Map();
  rows.forEach(r0=>{const k=String(r0[sK])+"\u0000"+String(r0[tK]);
    em.set(k,(em.get(k)||0)+(vK?(Number(r0[vK])||0):1));});
  const mx=Math.max(...em.values(),1);
  const ly=i=>L.length===1?.5:1-i/(L.length-1), ry=i=>Rt.length===1?.5:1-i/(Rt.length-1);
  const data=[];
  [...em.entries()].forEach(([k,w])=>{
    const [a,b]=k.split("\u0000"); const i=L.indexOf(a), j=Rt.indexOf(b);

B.chord=(c)=>{
  const {rows,R}=c;
  const G=edgeList(rows,R("source"),R("target"),R("value"));
  const n=G.nodes.length;
  if(n>18) throw new Error("A chord diagram gets unreadable past about 18 categories.");
  const total=sum(G.deg)||1, gap=.035, avail=2*Math.PI-n*gap;
  const start=[]; let a=0;
  G.deg.forEach(d=>{start.push(a); a+=avail*d/total+gap;});
  const span=i=>avail*G.deg[i]/total;
  const cursor=start.slice();
  const data=[];
  [...G.edges].sort((p,q)=>q.w-p.w).forEach(e=>{
    const w=e.w/total*avail;
    const a0=cursor[e.s], a1=a0+w/2; cursor[e.s]=a1;
    const b0=cursor[e.t], b1=b0+w/2; cursor[e.t]=b1;
    const rb=chordRibbon(a0,a1,b0,b1,.86);
    data.push({type:"scatter",mode:"lines",x:rb.x,y:rb.y,fill:"toself",
      fillcolor:hexA(pal(e.s),.42),line:{color:hexA(pal(e.s),.6),width:.5},
      showlegend:false,hoverinfo:"text",text:`${G.nodes[e.s]} ↔ ${G.nodes[e.t]}: ${fmtN(e.w)}`});
  });
  G.nodes.forEach((nd,i)=>{
    const X=[],Y=[]; const s=start[i], e2=start[i]+span(i);
    for(let k=0;k<=18;k++){const th=s+(e2-s)*k/18; X.push(Math.cos(th)); Y.push(Math.sin(th));}
    for(let k=18;k>=0;k--){const th=s+(e2-s)*k/18; X.push(Math.cos(th)*.9); Y.push(Math.sin(th)*.9);}
    data.push({type:"scatter",mode:"lines",x:X,y:Y,fill:"toself",fillcolor:pal(i),
      line:{width:0},showlegend:false,hoverinfo:"text",text:`${nd}: ${fmtN(G.deg[i])}`});
    const mid=(s+e2)/2;
    data.push({type:"scatter",mode:"text",x:[Math.cos(mid)*1.09],y:[Math.sin(mid)*1.09],
      text:[nm(nd)],textfont:{size:pt2px(S.style.fsTick)},showlegend:false,hoverinfo:"skip",cliponaxis:false,
      textposition:Math.cos(mid)<0?"middle left":"middle right"});
  });
  return {data,layout:{xaxis:{visible:false,range:[-1.5,1.5]},
    yaxis:{visible:false,range:[-1.25,1.25],scaleanchor:"x",scaleratio:1}},
    autoTitles:{x:"",y:""},noGrid:true};
};
function dendroSegs(root,order,vars){
  const yOf={}; order.forEach((leaf,i)=>yOf[leaf]=i);

    if(!nd.l) return {y:yOf[nd.m[0]],h:0};
    const a=place(nd.l), b=place(nd.r), y=(a.y+b.y)/2;
    segs.push({x:[a.h,nd.h,nd.h,b.h],y:[a.y,a.y,b.y,b.y]});
    return {y,h:nd.h};
  })(root);
  return segs;
}

B.dsm=(c)=>{
